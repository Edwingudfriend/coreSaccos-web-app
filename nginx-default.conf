server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;

    # App shell files must never be cached — they reference hashed lazy chunks
    location ~* ^/(main|polyfills|styles)\.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }
    location = /assets/env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
    }

    # Hashed JS/CSS/maps: if a file is missing, 404 — do NOT fall back to index.html
    # (prevents stale clients getting index.html with a text/html MIME error)
    location ~* \.(js|css|map)$ {
        try_files $uri =404;
    }

    # Angular hash-routing SPA fallback
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
